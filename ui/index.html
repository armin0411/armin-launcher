<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light"><title>Armin Launcher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%232d81ff' d='M8 8h16v32h32v16H8z'/%3E%3Cpath fill='%23fff' d='M32 8h24v24H40V24h-8z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script>
</head>
<body>
<div id="shell">
<header class="masthead">
<div class="identity"><span class="logo" aria-hidden="true">A<span>↗</span></span><div><h1>Armin Launcher<span class="title-dot">.</span></h1><p class="eyebrow">YOUR SOFTWARE. READY TO GO.</p></div></div>
<div class="mast-actions"><button id="theme" title="Toggle light mode" aria-label="Toggle light mode">◐</button><button id="add" class="secondary">＋ Add App</button></div>
</header>
<div class="toolbar">
<div class="toolbar-top"><nav id="filters" class="filters" aria-label="Filter apps"><button data-filter="all" class="selected" aria-pressed="true">All <span id="all-count"></span></button><button data-filter="installed" aria-pressed="false">Installed</button><button data-filter="updates" aria-pressed="false">Updates <span id="update-count"></span></button><button data-filter="hidden" aria-pressed="false">Hidden</button></nav><div id="counts" class="counts" aria-label="Library summary"></div></div>
<div class="toolbar-controls"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find an app…" aria-label="Search apps"></label><select id="sort" aria-label="Sort apps"><option value="name">Name A–Z</option><option value="category">Category</option><option value="updates">Updates first</option></select><div class="view-toggle" role="group" aria-label="View"><button id="grid-view" aria-label="Blocks view" title="Blocks view" aria-pressed="true">▦</button><button id="list-view" aria-label="Table view" title="Table view" aria-pressed="false"><svg class="table-icon" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true" focusable="false"><path d="M1 3h16v2H1zM1 8h16v2H1zM1 13h16v2H1z" fill="currentColor"/></svg></button></div><button id="refresh"><span id="refresh-icon">↻</span> Refresh</button><button id="update-all" class="primary">↑ Update All</button></div>
</div>
<div id="notice" role="status" aria-live="polite"><span class="status-dot"></span><span id="notice-text">Connecting to local launcher…</span></div>
<details id="warnings" hidden><summary>Refresh warnings</summary><pre></pre></details>
<main id="apps" class="grid" aria-label="Applications"></main>
<div id="empty" hidden><span class="empty-icon">⌕</span><h3>No apps here yet.</h3><p>Try another filter or add an app to your library.</p></div>
<footer><span><span class="status-dot"></span> LOCAL & ON DEMAND <span class="footer-sep">/</span> <span id="shown-count">0 APPS</span></span><div class="footer-right"><span class="zoom-label">UI SCALE</span><div class="zoom"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-reset" title="Reset zoom">100%</button><button id="zoom-in" aria-label="Zoom in">＋</button></div><span class="version-label">ARMIN LAUNCHER / 01</span></div></footer>
</div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog>
<template id="add-template"><form id="add-form"><div class="form-fields"><p class="muted">Add a release or package to your local catalog.</p><div class="form-grid"><label>Name<input name="name" required placeholder="My App"></label><label>ID<input name="id" required pattern="[a-z0-9][a-z0-9-]*" placeholder="my-app"></label><label>Publisher<input name="publisher" required placeholder="Publisher"></label><label>Category<input name="category" required value="Tools"></label><label class="full">Tagline<input name="tagline" required placeholder="What does it do?"></label><label class="full">Website<input name="website" type="url" required placeholder="https://…"></label><label>Accent<input name="accent" type="color" value="#2d81ff"></label><label>Source<select name="source_type"><option value="github_release">GitHub release</option><option value="arch_repo">Arch repository</option><option value="aur">AUR</option></select></label><label data-github>Repository<input name="repo" placeholder="owner/repo"></label><label data-github>Asset glob<input name="asset_pattern" placeholder="*x86_64.AppImage"></label><label data-github>Installer<select name="install_type"><option value="appimage">AppImage</option><option value="pacman_pkg">Pacman package file</option><option value="tarball">Tarball</option></select></label><label data-github class="checkbox"><input name="prerelease" type="checkbox"> Include prereleases</label><label class="full" id="install-field"><span>Binary filename</span><input name="target" required placeholder="my-app.AppImage"></label><label class="full">Launch command<input name="launch" required placeholder="my-app"></label></div><p id="form-error" role="alert"></p></div><div class="modal-actions"><button type="button" id="add-cancel">Cancel</button><button type="submit" class="primary">Add to Library</button></div></form></template>
</body></html>
